<!doctype html>
<html lang="en" data-theme="light" data-font-size="md">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stockline</title>
    <script>
      try {
        var p = JSON.parse(
          localStorage.getItem("stockline-prefs") ||
            localStorage.getItem("mise-prefs") ||
            localStorage.getItem("mza-prefs") ||
            "{}",
        );
        var theme =
          p.theme === "dark" || p.theme === "light"
            ? p.theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        if (p.fontSize === "sm" || p.fontSize === "md" || p.fontSize === "lg")
          document.documentElement.dataset.fontSize = p.fontSize;
        document.documentElement.lang =
          p.locale === "ka" || p.locale === "en" ? p.locale : "en";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
