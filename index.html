<!doctype html>
<html lang="en" data-theme="light" data-font-size="md">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stockline — kitchen production ops</title>
    <meta
      name="description"
      content="Multi-tenant kitchen ops: materials, compositions, production, sales, payroll, expenses, and P&L with consistent unit-cost logic."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stockline" />
    <meta property="og:title" content="Stockline — kitchen production ops" />
    <meta
      property="og:description"
      content="Materials → compositions → production → sales, plus payroll, expenses, and P&L — scoped per organization."
    />
    <meta
      property="og:url"
      content="https://stockline-app-zt12.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://stockline-app-zt12.vercel.app/apple-touch-icon.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Stockline — kitchen production ops" />
    <meta
      name="twitter:description"
      content="Materials → compositions → production → sales, plus payroll, expenses, and P&L — scoped per organization."
    />
    <meta
      name="twitter:image"
      content="https://stockline-app-zt12.vercel.app/apple-touch-icon.png"
    />
    <script>
      try {
        var p = JSON.parse(
          localStorage.getItem("stockline-prefs") ||
            localStorage.getItem("mise-prefs") ||
            localStorage.getItem("mza-prefs") ||
            "{}",
        );
        var theme =
          p.theme === "dark" || p.theme === "light"
            ? p.theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        if (p.fontSize === "sm" || p.fontSize === "md" || p.fontSize === "lg")
          document.documentElement.dataset.fontSize = p.fontSize;
        document.documentElement.lang =
          p.locale === "ka" || p.locale === "en" ? p.locale : "en";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
