<!doctype html>
<html lang="ka" data-theme="light" data-font-size="md">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mise</title>
    <script>
      try {
        var p = JSON.parse(
          localStorage.getItem("mise-prefs") ||
            localStorage.getItem("mza-prefs") ||
            "{}",
        );
        if (p.theme === "dark" || p.theme === "light")
          document.documentElement.dataset.theme = p.theme;
        if (p.fontSize === "sm" || p.fontSize === "md" || p.fontSize === "lg")
          document.documentElement.dataset.fontSize = p.fontSize;
        if (p.locale === "en" || p.locale === "ka")
          document.documentElement.lang = p.locale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
